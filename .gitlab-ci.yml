stages:
  - build
  - deploy

build:
  stage: build
  rules:
    - if: '$CI_COMMIT_BRANCH == "stage"'
      when: always
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
  tags:
    - docker
  image: node:20
  script:
    - npm ci --prefer-offline --progress=false
    - npm run build
  artifacts:
    expire_in: 1 hour
    paths:
      - dist


pages:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "stage"'
      when: always
  environment:
    name: stage
    url: https://$CI_PROJECT_ROOT_NAMESPACE.pages.wim.agency/$CI_PROJECT_NAME
  needs: ["build"]  
  dependencies:
    - build
  tags:
    - docker
  image: alpine
  script:
    - mv ./public/ ./public2/
    - mv ./dist/ ./public/
  artifacts:
    paths:
      - public

production:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
  environment:
    name: production
    url: https://ac.okmarket.brandsgames.ru
  needs: ["build"]
  dependencies:
    - build
  tags:
    - docker
  image: alpine
  before_script:
    - apk add --no-cache rsync
    - rsync --version
    - 'which ssh-agent || ( apk add --no-cache openssh-client )'
    - eval $(ssh-agent -s)
    # Add the SSH key stored in SSH_PRIVATE_KEY variable to the agent store
    - ssh-add <(echo "$SSH_PRIVATE_KEY")
    - mkdir -p ~/.ssh
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
  script:
    - rsync -aHv -e "ssh -p $SSH_PORT" --delete dist/ $SSH_USER@$SSH_HOST:$SSH_PATH
    
